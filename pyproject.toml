[build-system]
requires      = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "iriscc"
version = "0.1.0"
description = ""
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Leo Leummens", email = "Leo.Leummens@deltares.nl" },
    { name = "Rieke Santjer", email = "rieke.Santjer@deltares.nl" },
    { name = "Luuk Blom", email = "Luuk.Blom@deltares.nl" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Topic :: Scientific/Engineering :: Hydrology",
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "hydromt>=1.4.1",
    "hydromt_fiat==1.0.0rc5",
    "hydromt_sfincs==2.0.0rc3",
    "dfm_tools==0.45.0",
    "hydrolib",
    "hydrolib-core",
    "solara",
    "numpy",
    "matplotlib",
    "branca",
    "cartopy",
    "pyproj",
    "folium",
    "ipyleaflet",
    "ipywidgets",
    "xarray",
    "fsspec",
    "boto3",
    "s3fs",
    "zarr",
    "h5py",
    "h5netcdf",
    "xugrid",
    "shapely",
    "geopandas",
    "jupyter",
]
[project.optional-dependencies]
dev = ["ruff", "pre-commit", "nbstripout"]

[tool.pixi.workspace]
name = "iriscc"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
jupyter-server-proxy = ">=4.5.0,<5"
traitlets = ">=5.16.1,<6"
jupyterlab = ">=4.6.2,<5"

[tool.pixi.environments]
default = { features = ["dev"] }

[tool.pixi.tasks]
clean-notebooks = "jupyter nbconvert --to notebook --inplace **/*.ipynb"
all-notebooks = "jupyter nbconvert --execute --to notebook --inplace **/*.ipynb"
run-notebook = { cmd="jupyter nbconvert --execute --to notebook --inplace {{ NOTEBOOK }}", args=["NOTEBOOK"] }
# Serve the SFINCS Solara app behind the d4science JupyterHub proxy.
solara-sfincs = { cmd = "echo \"Open this in your browser: https://jupyterhub.d4science.org/user/$JUPYTERHUB_USER/proxy/8765/\" && solara run SFINCS/solara/app_sfincs.py --host=0.0.0.0 --port=8765 --root-path=/user/$JUPYTERHUB_USER/proxy/8765", env = { FORWARDED_ALLOW_IPS = "*", UVICORN_PROXY_HEADERS = "1" } }
nc-to-zarr = { cmd = "python SFINCS/scripts/nc_to_zarr.py --src {{ SRC }} --dst {{ DST }} --drop-variables projection --chunks lat=6000 lon=6000", args = ["SRC", "DST"] }

[tool.pixi.feature.dev.tasks]
install-precommit = "pre-commit install"
lint = "pre-commit run --all-files"
