[build-system]
requires      = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "iriscc"
version = "0.1.0"
description = ""
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Leo Leummens", email = "Leo.Leummens@deltares.nl" },
    { name = "Rieke Santjer", email = "rieke.Santjer@deltares.nl" },
    { name = "Luuk Blom", email = "Luuk.Blom@deltares.nl" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Topic :: Scientific/Engineering :: Hydrology",
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "hydromt>=1.3.1",
    "hydromt_fiat==1.0.0rc4",
    "hydromt_sfincs==2.0.0rc1",
    "dfm_tools==0.45.0",
    "hydrolib",
    "hydrolib-core",
    "solara",
    "numpy",
    "matplotlib",
    "branca",
    "cartopy",
    "pyproj",
    "folium",
    "ipyleaflet",
    "ipywidgets",
    "xarray",
    "fsspec",
    "boto3",
    "s3fs",
    "zarr",
    "xugrid",
    "shapely",
    "geopandas",
    "jupyter",
]
[project.optional-dependencies]
dev = ["ruff", "pre-commit", "nbstripout"]

[tool.pixi.workspace]
name = "iriscc"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["dev"] }

[tool.pixi.tasks]
clean-notebooks = "jupyter nbconvert --to notebook --inplace **/*.ipynb"
all-notebooks = "jupyter nbconvert --execute --to notebook --inplace **/*.ipynb"
run-notebook = { cmd="jupyter nbconvert --execute --to notebook --inplace {{ NOTEBOOK }}", args=["NOTEBOOK"] }

[tool.pixi.feature.dev.tasks]
install-precommit = "pre-commit install"
lint = "pre-commit run --all-files"
