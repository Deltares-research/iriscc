meta:
  version: v0.1.0
  hydromt_version: ">=1.0a, <2"
  name: iriscc_data

deltadtm:
  data_type: RasterDataset
  version: 1.0
  uri: https://s3.deltares.nl/iriscc/topography/delta_dtm/deltadtm_v1_1.vrt
  driver:
    name: rasterio
    options:
      chunks:
        x: 3600
        y: 3600
  metadata:
    category: topography
    paper_doi: 10.1038/s41597-024-03091-9
    paper_ref: Pronk et al. (2023)
    url: https://www.nature.com/articles/s41597-024-03091-9
    license: CC-BY 4.0
    extent:
      bbox:
        West: -180.0
        South: -60.0
        East: 180.0
        North: 80.0
    crs: 4326
  data_adapter:
    rename:
      deltadtm: elevtn

gcn250:
  data_type: RasterDataset
  version: 1
  uri: https://s3.deltares.nl/iriscc/landuse/gcn250/GCN250_*.tif
  driver:
    name: rasterio
    options:
      chunks:
        x: 3600
        y: 3600
  metadata:
    category: soil
    paper_doi: 10.1038/s41597-019-0155-x
    paper_ref: Jaafar et al. (2019)
    url: https://doi.org/10.6084/m9.figshare.7756202.v1
    license: CC BY 4.0
    extent:
      bbox:
        West: -180
        South: -56
        East: 180.0
        North: 84.0
    nodata: 255
  data_adapter:
    rename:
      GCN250_ARCI: cn_dry
      GCN250_ARCII: cn_avg
      GCN250_ARCIII: cn_wet

gebco:
  data_type: RasterDataset
  version: 2020
  uri: https://s3.deltares.nl/iriscc/bathymetry/gebco/gebco.vrt
  driver:
    name: rasterio
    options:
      chunks:
        x: 3600
        y: 3600
  metadata:
    category: topography
    paper_doi: 10.5285/a29c5465-b138-234d-e053-6c86abc040b9
    paper_ref: Weatherall et al (2020)
    unit: m+MSL
    processing_script: bathymetry/gebco/gebco_tiles.ipynb
    url: https://www.bodc.ac.uk/data/hosted_data_systems/gebco_gridded_bathymetry_data/
    license: https://www.gebco.net/data_and_products/gridded_bathymetry_data/#a1
    extent:
      bbox:
        West: -180.0
        South: -90.0
        East: 180.0
        North: 90.0
    crs: 4326
  data_adapter:
    rename:
      gebco: elevtn

globcover:
  data_type: RasterDataset
  version: 2.3
  uri: https://s3.deltares.nl/iriscc/landuse/globcover/GLOBCOVER_L4_200901_200912_V2.3.tif
  driver:
    name: rasterio
    options:
      chunks:
        x: 3600
        y: 3600
  metadata:
    category: landuse
    paper_doi: 10.1594/PANGAEA.787668
    paper_ref: Arino et al (2012)
    url: http://due.esrin.esa.int/page_globcover.php
    license: CC-BY-3.0
    extent:
      bbox:
        West: -180.001
        South: -64.999
        East: 179.999
        North: 90.001
    crs: 4326

hydro_basin_atlas_level12_s3:
  data_type: GeoDataFrame
  version: 10
  uri: https://s3.deltares.nl/iriscc/hydrography/hydro_atlas/basin_atlas_v10.gpkg
  driver:
    name: pyogrio
    options:
      layer: BasinATLAS_v10_lev12
    filesystem:
      protocol: s3
      anon: true
  metadata:
    category: hydrography
    notes: renaming and units might require some revision
    paper_doi: 10.1038/s41597-019-0300-6
    paper_ref: Linke et al. (2019)
    url: https://www.hydrosheds.org/hydroatlas
    license: CC BY 4.0
    extent:
      bbox:
        West: -180
        South: -55.988
        East: 180.001
        North: 83.626
    crs: 4326

merit_hydro:
  data_type: RasterDataset
  version: 1.0
  uri: https://s3.deltares.nl/iriscc/topography/merit_hydro/*.vrt
  driver:
    name: rasterio
    options:
      chunks:
        x: 6000
        y: 6000
  metadata:
    category: topography
    paper_doi: 10.1029/2019WR024873
    paper_ref: Yamazaki et al. (2019)
    processing_notes: create vrt file with gdalbuildvrt; additional variables for
      stream-order, basin index (basins), and slope (lndslp) derived with
      pyflwdir
    url: http://hydro.iis.u-tokyo.ac.jp/~yamadai/MERIT_Hydro
    license: CC-BY-NC 4.0 or ODbL 1.0
    extent:
      bbox:
        West: -180
        South: -60
        East: 180.0
        North: 85.0
    crs: 4326
  data_adapter:
    rename:
      bas: basins
      dir: flwdir
      elv: elevtn
      slp: lndslp
      sto: strord
      upa: uparea
      upg: upgrid
      wth: rivwth

era5_hourly:
  data_type: RasterDataset
  uri: https://api.earthdatahub.destine.eu/era5/reanalysis-era5-single-levels-v0.zarr
  driver:
    name: raster_xarray
    filesystem:
      protocol: https
    options:
      decode_times: true
      storage_options:
        client_kwargs:
          trust_env: true
  metadata:
    category: meteo
    notes: Extracted from Earth Data Hub
    paper_doi: 10.1002/qj.3803
    paper_ref: Hersbach et al. (2019)
    url: https://earthdatahub.destine.eu/collections/era5/datasets/reanalysis-era5-single-levels
    license: CC-BY-4.0
    extent:
      bbox:
        West: -0.125
        South: -90.125
        East: 359.875
        North: 90.125
      time_range:
        start: '1950-01-01'
        end: 'present'
    crs: 4326
  data_adapter:
    unit_mult:
      kin: 0.000277778
      kout: 0.000277778
      ssr: 0.000277778
      precip: 1000
      e: 1000
      pev: 1000
      ro: 1000
      press_msl: 0.01
    rename:
      valid_time: time
      d2m: temp_dew
      msl: press_msl
      pev: pet
      ssrd: kin
      t2m: temp
      tisr: kout
      tp: precip
      u10: wind10_u
      v10: wind10_v
    unit_add:
      temp: -273.15
      temp_dew: -273.15
